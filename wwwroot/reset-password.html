<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Baratrum</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 16px;
    outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.4); }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #0a84ff;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #message { font-size: 13px; margin-top: 16px; text-align: center; display: none; }
  #message.ok { color: #30d158; display: block; }
  #message.err { color: #ff453a; display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p class="sub" id="subtitle">Set a new password for your account.</p>
    <form id="form">
      <input type="password" id="newPassword" placeholder="New password" required minlength="8" autocomplete="new-password">
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
      <button type="submit" id="submitBtn">Set new password</button>
    </form>
    <p id="message"></p>
  </div>

<script>
  // This page is meant to be served from the API itself (wwwroot on
  // api.baratrum.com), so the fetch below is same-origin and needs no CORS.
  const params = new URLSearchParams(location.search);
  const email = params.get("email") || "";
  const code = params.get("code") || "";

  const form = document.getElementById("form");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");
  const subtitle = document.getElementById("subtitle");

  if (email) subtitle.textContent = "Set a new password for " + email + ".";

  if (!email || !code) {
    form.style.display = "none";
    msg.className = "err";
    msg.textContent = "This reset link is invalid or incomplete. Request a new one from the app.";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "";
    msg.style.display = "none";

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      msg.className = "err";
      msg.textContent = "Passwords don't match.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const res = await fetch("/api/Auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, code, newPassword })
      });

      if (res.ok) {
        form.style.display = "none";
        subtitle.textContent = "";
        msg.className = "ok";
        msg.textContent = "Password reset. You can log in with your new password now.";
        return;
      }

      let detail = "Reset failed. The link may have expired — request a new one from the app.";
      try {
        const body = await res.json();
        if (Array.isArray(body)) {
          detail = body.map(e => e.description).join(" ");
        } else if (typeof body === "string") {
          detail = body;
        } else if (body && (body.detail || body.title)) {
          detail = body.detail || body.title;
        }
      } catch (_) { /* keep default message */ }

      msg.className = "err";
      msg.textContent = detail;
    } catch (_) {
      msg.className = "err";
      msg.textContent = "Network error. Check your connection and try again.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Set new password";
    }
  });
</script>
</body>
</html>
