services:
  baratrum-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baratrum-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5042:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=auth-db-test;Database=baratrum;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;
      - RunningLocal=${RunningLocal:-true}
      - BrainEndpoint=${BrainEndpoint:-http://127.0.0.1:8080}
      - EarsEndpoint=${EarsEndpoint:-http://127.0.0.1:8000}
      - MouthEndpoint=${MouthEndpoint:-http://127.0.0.1:8000}
    volumes:
      - baratrum-storage:/app/Storage:rw
    networks:
      - baratrum-net
    depends_on:
      auth-db-test:
        condition: service_healthy

  auth-db-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auth-db-test
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - auth-db-data:/var/opt/mssql
    networks:
      - baratrum-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  baratrum-net:
    driver: bridge

volumes:
  baratrum-storage:
  auth-db-data: